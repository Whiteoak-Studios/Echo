[package]
name = "fadeluc-123/echo"
description = "A reactive sound module, used to minimize the amount of datamodels to be kept track of. Visit Whiteoak Studios for documentation: https://github.com/Whiteoak-Studios/Echo"
version = "7.8.6"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
license = "Apache-2.0"
authors = ["Michael Sumner <mike@whiteoak.studio>"]
homepage = "https://github.com/Whiteoak-Studios/Echo"
repository = "https://github.com/Whiteoak-Studios/Echo"

exclude = ["**"]
include = ["src", "src/**", "default.project.json", "wally.toml", "README.md", "LICENSE"]

[dependencies]
Promise = "evaera/promise@^4.0.0"
Cellar = "fadeluc-123/cellar@^0.1.0"
