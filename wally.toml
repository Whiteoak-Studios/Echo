[package]
name = "fadeluc-123/echo"
description = "Declarative, React-shaped sounds for Roblox, played from pools of voices on the Audio API or the legacy sound system. Docs: https://github.com/Whiteoak-Studios/Echo"
version = "8.0.0"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
license = "Apache-2.0"
authors = ["Michael Sumner <mike@whiteoak.studio>"]
homepage = "https://github.com/Whiteoak-Studios/Echo"
repository = "https://github.com/Whiteoak-Studios/Echo"

exclude = ["**"]
include = ["src", "src/**", "default.project.json", "wally.toml", "README.md", "CHANGELOG.md", "LICENSE"]

[dependencies]
Promise = "evaera/promise@^4.0.0"
Cellar = "fadeluc-123/cellar@^0.1.0"
